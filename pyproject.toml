[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsize-auth"
version = "0.1.0"
description = "Framework-agnostic authentication primitives: argon2id passwords, JWT and opaque tokens, and generic OAuth2."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Capsize LLC", email = "contact@capsizegames.com" },
]
keywords = [
    "authentication",
    "oauth2",
    "argon2",
    "jwt",
    "pkce",
    "passwords",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "zxcvbn>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/capsize-games/capsize-auth"
Issues = "https://github.com/capsize-games/capsize-auth/issues"

[tool.setuptools.packages.find]
where = ["src"]

# The package is mypy --strict clean, so the marker is a claim it can keep.
# Without it every consumer sees this library's types as Any, which silently
# turns their own strict checks into no checks at all.
[tool.setuptools.package-data]
capsize_auth = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
