[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uwuchat-auth-core"
version = "0.1.0"
description = "Reusable JWT / password / OAuth auth primitives behind a storage interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0",
    "zxcvbn>=4.4",
]

[project.optional-dependencies]
migrations = ["alembic>=1.13"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:uwuchat_auth_core.*"]
