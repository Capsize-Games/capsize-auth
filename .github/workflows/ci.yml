name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy src/capsize_auth

      - name: Tests
        run: pytest -q

  # Branch protection requires the stable `check` context. Keep the
  # versioned jobs above as the compatibility matrix, then publish one
  # aggregate result for merge protection.
  check:
    if: ${{ always() }}
    needs: [check-python]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python check
        if: ${{ needs.check-python.result != 'success' }}
        run: exit 1
      - name: Matrix passed
        run: echo "All Python matrix checks passed"
